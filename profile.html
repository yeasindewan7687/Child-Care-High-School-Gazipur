<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | Child Care HS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .profile-card { background: linear-gradient(135deg, #1e3a8a, #1e40af); }
    </style>
</head>
<body class="bg-slate-100 font-sans" onload="initDashboard()">
    
    <nav class="bg-white p-4 shadow flex justify-between px-10 items-center sticky top-0 z-50">
        <h2 class="font-black text-blue-900 uppercase italic tracking-tighter">My Dashboard</h2>
        <a href="index.html" onclick="localStorage.removeItem('currentUser')" class="text-red-500 font-black flex items-center gap-2">
            <i class="fas fa-sign-out-alt"></i> LOGOUT
        </a>
    </nav>

    <header class="profile-card py-16 text-center text-white shadow-2xl rounded-b-[60px]">
        <div class="max-w-xl mx-auto px-6">
            <img src="https://ui-avatars.com/api/?name=User&background=fff&color=1e3a8a&size=120" class="mx-auto rounded-full border-4 border-white/20 mb-6 shadow-2xl">
            <h1 id="pName" class="text-4xl font-black uppercase tracking-tighter italic">-- Loading --</h1>
            <div class="mt-4 flex justify-center gap-4 font-bold text-blue-100 italic">
                <span id="pClass" class="bg-white/10 px-6 py-2 rounded-full border border-white/10">Class: --</span>
                <span id="pID" class="bg-white/10 px-6 py-2 rounded-full border border-white/10">ID: --</span>
            </div>
        </div>
    </header>

    <main class="container mx-auto px-6 py-12 grid grid-cols-1 md:grid-cols-3 gap-10">
        <!-- Dashboard Sections -->
        <div class="bg-white p-8 rounded-[40px] shadow-2xl border-t-8 border-green-600">
            <h3 class="text-xl font-black text-green-700 mb-6 uppercase italic"><i class="fas fa-book-open mr-2"></i> Class Diary</h3>
            <div id="pDiary" class="space-y-4"></div>
        </div>

        <div class="bg-white p-8 rounded-[40px] shadow-2xl border-t-8 border-red-600 text-center">
            <h3 class="text-xl font-black text-red-700 mb-6 uppercase italic"><i class="fas fa-chart-line mr-2"></i> My Result</h3>
            <div id="pResult" class="py-6"></div>
        </div>

        <div class="bg-white p-8 rounded-[40px] shadow-2xl border-t-8 border-blue-600 text-center">
            <h3 class="text-xl font-black text-blue-700 mb-6 uppercase italic"><i class="fas fa-money-check-alt mr-2"></i> Payment</h3>
            <div id="pPay" class="py-6"></div>
        </div>
    </main>

    <script>
        function initDashboard() {
            const user = JSON.parse(localStorage.getItem('currentUser'));
            if(!user) { window.location.href = 'login.html'; return; }

            document.getElementById('pName').innerText = user.name;
            document.getElementById('pClass').innerText = "Class: " + user.class;
            document.getElementById('pID').innerText = "ID: " + user.id;

            // Load Specific Diary for this class
            let diaries = JSON.parse(localStorage.getItem('diaries')) || {};
            let myClsDiary = diaries[user.class] || [];
            document.getElementById('pDiary').innerHTML = myClsDiary.slice(0, 3).map(d => `
                <div class="p-4 bg-slate-50 rounded-2xl border-l-4 border-blue-800 text-sm">
                    <p class="font-bold text-blue-900 underline uppercase">${d.sub}</p>
                    <p class="italic text-slate-600 mt-1">"${d.task}"</p>
                </div>
            `).join('') || "<p class='italic text-slate-400'>No homework today.</p>";

            // Load Specific Result
            let results = JSON.parse(localStorage.getItem('results')) || {};
            let myRes = results[user.id];
            document.getElementById('pResult').innerHTML = myRes ? `
                <h4 class="text-6xl font-black text-blue-900">${myRes.gpa}</h4>
                <p class="text-[10px] font-black text-slate-400 mt-4 uppercase">Last Update: ${myRes.date}</p>` 
                : "<p class='italic text-slate-400'>Result not uploaded.</p>";

            // Load Specific Payment
            let payments = JSON.parse(localStorage.getItem('payments')) || {};
            let myPay = (payments[user.id] && payments[user.id]['April']) ? payments[user.id]['April'] : "Unpaid";
            let col = myPay === 'Paid' ? 'text-green-600' : 'text-red-600';
            document.getElementById('pPay').innerHTML = `
                <h4 class="text-3xl font-black ${col}">${myPay.toUpperCase()}</h4>
                <p class="text-[10px] font-black text-slate-400 mt-4 uppercase italic">Status: April Month</p>
                ${myPay === 'Unpaid' ? '<button class="mt-6 bg-orange-500 text-white px-8 py-2 rounded-xl font-bold shadow-lg">PAY NOW</button>' : ''}`;
        }
    </script>
</body>
</html>
