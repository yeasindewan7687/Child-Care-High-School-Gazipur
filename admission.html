<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Admission | Child Care High School</title>
    <script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-blue-50">
    <div class="container mx-auto py-16 px-6">
        <div class="max-w-2xl mx-auto bg-white p-10 rounded-3xl shadow-2xl border-t-8 border-orange-500">
            <h1 class="text-3xl font-black text-center mb-8 uppercase text-slate-800">Online Admission Form</h1>
            <form class="space-y-4">
                <input type="text" placeholder="Student's Full Name" class="w-full border p-3 rounded-xl">
                <select class="w-full border p-3 rounded-xl bg-white">
                    <option>Select Class...</option>
                    <option>Play</option><option>Nursery</option><option>Class 1-10</option>
                </select>
                <input type="text" placeholder="Guardian's Phone" class="w-full border p-3 rounded-xl">
                <textarea placeholder="Present Address" class="w-full border p-3 rounded-xl h-24"></textarea>
                <button type="button" onclick="alert('Submitted!')" class="w-full bg-orange-600 text-white py-4 rounded-xl font-black text-lg">Apply for Admission</button>
            </form>
            <p class="text-center mt-6 font-bold"><a href="index.html" class="text-blue-800 underline">Back to Home</a></p>
        </div>
    </div>
</body>
</html>
