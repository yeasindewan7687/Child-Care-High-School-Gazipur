<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Contact Us | Child Care HS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-slate-50">
    <div class="container mx-auto py-20 px-6 max-w-5xl">
        <h2 class="text-4xl font-black text-blue-900 mb-10 text-center uppercase tracking-tighter underline decoration-red-600">Contact With Us</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-10">
            <div class="bg-blue-900 text-white p-10 rounded-3xl shadow-2xl">
                <h3 class="text-2xl font-bold mb-6 italic underline uppercase">Our Office</h3>
                <p class="mb-6"><i class="fas fa-map-marker-alt text-red-500 text-xl mr-3"></i> Baniarchala, Memberbari, Bhabanipur, Gazipur.</p>
                <p class="mb-6"><i class="fas fa-phone-alt text-green-400 text-xl mr-3"></i> +8801823371159</p>
                <p class="mb-6"><i class="fas fa-envelope text-yellow-400 text-xl mr-3"></i> info@childcarehs.edu.bd</p>
                <a href="index.html" class="inline-block mt-10 bg-white text-blue-900 px-6 py-2 rounded-full font-bold">Back to Home</a>
            </div>
            <div class="bg-white p-10 rounded-3xl shadow-xl">
                <h3 class="text-2xl font-bold text-slate-800 mb-6 italic">Send Message</h3>
                <input type="text" placeholder="Name" class="w-full border p-3 rounded-xl mb-4">
                <textarea placeholder="Message" class="w-full border p-3 rounded-xl h-24 mb-4"></textarea>
                <button class="bg-blue-800 text-white px-8 py-3 rounded-xl font-bold">Send</button>
            </div>
        </div>
    </div>
</body>
</html>
