<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Child Care High School</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f8fafc; }
        .glass-nav { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(15px); }
        input, textarea { @apply w-full border-2 border-slate-100 bg-slate-50 p-4 rounded-2xl outline-none focus:border-blue-600 focus:bg-white transition-all; }
    </style>
</head>
<body class="bg-slate-50 font-sans" id="mainBody">

    <!-- HEADER (Same as Index) -->
    <header class="fixed w-full top-0 z-[100] shadow-lg">
        <nav class="glass-nav border-b border-slate-200">
            <div class="container mx-auto px-4 lg:px-8 py-3 flex justify-between items-center">
                <a href="index.html" class="font-black text-blue-900 uppercase">CHILD CARE HS</a>
                <a href="index.html" class="font-bold text-blue-800 underline">HOME</a>
            </div>
        </nav>
    </header>

    <main class="pt-24 pb-20">
        <div class="container mx-auto px-4 lg:px-20">
            <h2 class="text-center text-4xl font-black text-blue-900 uppercase italic mb-12">Contact Information</h2>
            
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-12">
                <!-- Message Form -->
                <div class="bg-white p-8 lg:p-12 rounded-[40px] shadow-2xl border-t-8 border-blue-800">
                    <h3 class="text-2xl font-bold mb-6 italic italic uppercase">Send a Message</h3>
                    <div class="space-y-4">
                        <input type="text" id="msgName" placeholder="Your Name">
                        <textarea id="msgBody" placeholder="Type your message here..." rows="4"></textarea>
                        <button onclick="sendMessage()" class="w-full bg-blue-800 text-white py-4 rounded-2xl font-black shadow-lg hover:bg-black transition uppercase">Send Message</button>
                    </div>
                </div>

                <!-- Info Cards -->
                <div class="space-y-6">
                    <div class="bg-blue-900 text-white p-8 rounded-[40px] shadow-xl flex items-center gap-6">
                        <i class="fas fa-phone-alt text-3xl text-green-400"></i>
                        <div><p class="text-xs font-bold uppercase opacity-60">Call Us</p><h4 class="text-xl font-black tracking-widest">+880 1823-371159</h4></div>
                    </div>
                    <div class="bg-white p-8 rounded-[40px] shadow-xl flex items-center gap-6 border-l-8 border-red-600">
                        <i class="fas fa-map-marker-alt text-3xl text-red-600"></i>
                        <div><p class="text-xs font-bold uppercase text-slate-400">Our Location</p><h4 class="text-lg font-black text-slate-800 italic leading-tight">Baniarchala, Memberbari, Gazipur.</h4></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-slate-900 text-white py-10 text-center">
        <p class="text-[10px] font-black uppercase tracking-[5px]">&copy; 2026. ALL RIGHTS RESERVED.</p>
        <p class="text-slate-500 text-[9px] mt-4 uppercase font-bold tracking-widest">Dev: <a href="https://wa.me/8801823371159" class="text-blue-400">Yeasin Solution</a></p>
    </footer>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = { apiKey: "AIzaSyCL8XMXMrKVZm-W-V92z0FMuiZqBP6W_cU", authDomain: "childcarehs-32f0e.firebaseapp.com", databaseURL: "https://childcarehs-32f0e-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "childcarehs-32f0e", storageBucket: "childcarehs-32f0e.appspot.com", messagingSenderId: "141971192886", appId: "1:141971192886:web:70db4fd887bd9b02ebac97" };
        firebase.initializeApp(firebaseConfig); const db = firebase.database();

        function sendMessage() {
            const name = document.getElementById('msgName').value;
            const message = document.getElementById('msgBody').value;
            if(!name || !message) return alert("Fill Name and Message!");
            db.ref('messages').push({ name, message, date: new Date().toLocaleString() })
            .then(() => { alert("Message Sent Successfully!"); document.getElementById('msgName').value=""; document.getElementById('msgBody').value=""; });
        }
    </script>
</body>
</html>
