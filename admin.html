<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Control | Child Care HS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f8fafc; }
        .tab-btn.active { background: #1e40af; color: white; box-shadow: 0 10px 15px -3px rgba(30, 64, 175, 0.3); }
        .hidden { display: none; }
        input, select, textarea { border: 2px solid #e2e8f0; border-radius: 12px; padding: 12px; outline: none; width: 100%; }
        input:focus, select:focus { border-color: #1e40af; background: #fff; }
    </style>
</head>
<body class="min-h-screen flex flex-col lg:flex-row">
    <aside class="w-full lg:w-72 bg-white shadow-2xl flex flex-col p-6 z-50">
        <h1 class="text-2xl font-black text-blue-900 italic mb-10 text-center uppercase">MASTER <span class="text-red-600 font-black">ADMIN</span></h1>
        <nav class="space-y-2 flex-1 overflow-y-auto">
            <button onclick="openTab(event, 'studentTab')" class="tab-btn active w-full flex items-center p-4 rounded-2xl font-bold transition-all text-slate-600"><i class="fas fa-users-cog mr-4"></i> Users</button>
            <button onclick="openTab(event, 'notTab')" class="tab-btn w-full flex items-center p-4 rounded-2xl font-bold transition-all text-slate-600"><i class="fas fa-bullhorn mr-4"></i> Notice Board</button>
            <button onclick="openTab(event, 'diaTab')" class="tab-btn w-full flex items-center p-4 rounded-2xl font-bold transition-all text-slate-600"><i class="fas fa-book mr-4 text-sky-500"></i> Class Diary</button>
            <button onclick="openTab(event, 'admTab')" class="tab-btn w-full flex items-center p-4 rounded-2xl font-bold transition-all text-slate-600"><i class="fas fa-user-plus mr-4 text-red-600"></i> Admissions</button>
            <button onclick="openTab(event, 'msgTab')" class="tab-btn w-full flex items-center p-4 rounded-2xl font-bold transition-all text-slate-600"><i class="fas fa-envelope mr-4 text-purple-600"></i> Messages</button>
            <button onclick="openTab(event, 'settingsTab')" class="tab-btn w-full flex items-center p-4 rounded-2xl font-bold transition-all text-slate-600"><i class="fas fa-cog mr-4"></i> Settings</button>
        </nav>
        <a href="index.html" class="mt-10 border-t pt-6 text-red-500 font-bold text-center">EXIT ADMIN</a>
    </aside>

    <main class="flex-1 p-4 lg:p-10 overflow-y-auto lg:h-screen">
        <!-- Student Create Section -->
        <div id="studentTab" class="tab-content">
            <div class="bg-white p-8 rounded-[40px] shadow-xl border-t-8 border-blue-600 mb-10">
                <h2 class="text-2xl font-black mb-6 uppercase">Create Account</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                    <input id="stdName" type="text" placeholder="Full Name">
                    <input id="stdID" type="text" placeholder="ID Number">
                    <input id="stdPass" type="password" placeholder="Password">
                    <select id="stdClass"><option>One</option><option>Six</option><option>Ten</option></select>
                </div>
                <button onclick="saveStudent()" class="mt-6 w-full bg-blue-800 text-white font-black py-4 rounded-2xl">SAVE ACCOUNT</button>
            </div>
            <div id="userTableBox" class="bg-white p-6 rounded-3xl shadow-xl overflow-x-auto"></div>
        </div>

        <!-- Admissions List Section -->
        <div id="admTab" class="tab-content hidden">
            <h2 class="text-2xl font-black mb-6 uppercase italic">New Admission Requests</h2>
            <div id="admissionListBox" class="bg-white p-6 rounded-3xl shadow-xl overflow-x-auto"></div>
        </div>

        <!-- Messages Section -->
        <div id="msgTab" class="tab-content hidden">
            <h2 class="text-2xl font-black mb-6 uppercase italic">Messages from Contact Page</h2>
            <div id="messageListBox" class="space-y-4"></div>
        </div>

        <!-- Settings Section -->
        <div id="settingsTab" class="tab-content hidden">
            <div class="bg-white p-10 rounded-[40px] shadow-2xl border-t-8 border-slate-900 max-w-lg mx-auto">
                <h2 class="text-2xl font-black text-slate-800 uppercase mb-8 text-center">Change Admin Pass</h2>
                <input id="oldAdminPass" type="password" placeholder="Current Password" class="mb-4">
                <input id="newAdminPass" type="password" placeholder="New Password" class="mb-6">
                <button onclick="changeAdminPass()" class="w-full bg-slate-900 text-white font-black py-4 rounded-2xl">UPDATE</button>
            </div>
        </div>
        
        <!-- (বাকি ট্যাবগুলো যেমন নোটিশ ও ডায়েরি আগের মতোই থাকবে) -->
        <div id="notTab" class="tab-content hidden">
            <div class="bg-white p-8 rounded-[40px] shadow-xl border-t-8 border-orange-500 mb-10">
                <h2 class="text-2xl font-black text-slate-800 mb-6 uppercase">Post Notice</h2>
                <input id="notTitle" type="text" placeholder="Title" class="mb-4">
                <textarea id="notDesc" placeholder="Description" class="mb-4 h-32"></textarea>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4"><input id="notLink" type="text" placeholder="Media Link"><input id="notFile" type="file" accept="image/*,.pdf" class="bg-slate-50 p-2"></div>
                <button onclick="saveNotice()" class="w-full bg-orange-600 text-white py-4 rounded-2xl">PUBLISH</button>
            </div>
            <div id="noticeHistory" class="space-y-4"></div>
        </div>

        <div id="diaTab" class="tab-content hidden">
            <div class="bg-white p-8 rounded-[40px] shadow-xl border-t-8 border-sky-500 mb-10">
                <h2 class="text-2xl font-black text-slate-800 mb-6 uppercase tracking-tighter italic">Class Diary Update</h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                    <select id="diaryCls" onchange="autoSub(); loadDiaryHistory();"><option value="">-- Class --</option><option>Six</option><option>Ten</option></select>
                    <select id="diarySub"><option>Select Subject</option></select>
                    <input id="diaryDate" type="date">
                </div>
                <textarea id="diaryTask" placeholder="Homework" class="mb-4 h-32"></textarea>
                <button onclick="saveDiary()" class="w-full bg-sky-600 text-white py-4 rounded-2xl font-black">POST DIARY</button>
            </div>
            <div id="diaryHistory" class="space-y-4"></div>
        </div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = { apiKey: "AIzaSyCL8XMXMrKVZm-W-V92z0FMuiZqBP6W_cU", authDomain: "childcarehs-32f0e.firebaseapp.com", databaseURL: "https://childcarehs-32f0e-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "childcarehs-32f0e", storageBucket: "childcarehs-32f0e.appspot.com", messagingSenderId: "141971192886", appId: "1:141971192886:web:70db4fd887bd9b02ebac97" };
        firebase.initializeApp(firebaseConfig); const db = firebase.database();

        function openTab(evt, id) { 
            document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden')); 
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active')); 
            document.getElementById(id).classList.remove('hidden'); evt.currentTarget.classList.add('active');
            if(id === 'studentTab') loadStudents();
            if(id === 'admTab') loadAdmissions();
            if(id === 'msgTab') loadMessages();
            if(id === 'notTab') loadNotices();
        }

        // Functions for Admissions & Messages
        function loadAdmissions() {
            db.ref('admissions').on('value', snap => {
                let data = snap.val(); let h = `<table class="w-full text-xs"><tr><th>Name</th><th>Class</th><th>Phone</th><th>Action</th></tr>`;
                for(let i in data) h += `<tr><td>${data[i].name}</td><td>${data[i].class}</td><td>${data[i].phone}</td><td><button onclick="db.ref('admissions/${i}').remove()" class="text-red-500">Del</button></td></tr>`;
                document.getElementById('admissionListBox').innerHTML = h + "</table>";
            });
        }
        function loadMessages() {
            db.ref('messages').on('value', snap => {
                let data = snap.val(); let h = "";
                for(let i in data) h += `<div class="p-4 bg-white shadow-sm border rounded-xl flex justify-between"><div><b>${data[i].name}:</b> ${data[i].message} <br><small>${data[i].date}</small></div><button onclick="db.ref('messages/${i}').remove()" class="text-red-500">Del</button></div>`;
                document.getElementById('messageListBox').innerHTML = h || "No messages.";
            });
        }

        // [Student, Notice, Diary Logics go here (using db.ref().push or .set)]
        function saveStudent() { const id = document.getElementById('stdID').value.trim(); db.ref('students/' + id).set({ name: document.getElementById('stdName').value, id: id, password: document.getElementById('stdPass').value, class: document.getElementById('stdClass').value }).then(() => alert("Saved!")); }
        function loadStudents() { db.ref('students').on('value', (snap) => { let data = snap.val(); let h = `<table class="w-full text-xs"><tr><th>Name</th><th>ID</th><th>Pass</th><th>Class</th><th>Action</th></tr>`; for(let id in data) h += `<tr><td>${data[id].name}</td><td>${data[id].id}</td><td>${data[id].password}</td><td>${data[id].class}</td><td><button onclick="db.ref('students/${id}').remove()" class="text-red-500">Del</button></td></tr>`; document.getElementById('userTableBox').innerHTML = h + "</table>"; }); }
        
        async function saveNotice() { 
            let fileData = ""; const fInput = document.getElementById('notFile');
            if(fInput.files[0]) { const reader = new FileReader(); reader.readAsDataURL(fInput.files[0]); await new Promise(r => reader.onload = () => { fileData = reader.result; r(); }); }
            db.ref('notices').push({ title: document.getElementById('notTitle').value, desc: document.getElementById('notDesc').value, link: document.getElementById('notLink').value, file: fileData, date: new Date().toLocaleDateString(), timestamp: Date.now() }).then(() => alert("Published!"));
        }
        function loadNotices() { db.ref('notices').orderByChild('timestamp').on('value', (snap) => { let data = snap.val(); let list = []; for(let id in data) list.unshift({id, ...data[id]}); document.getElementById('noticeHistory').innerHTML = list.map(n => `<div class="p-4 bg-slate-50 border rounded-xl flex justify-between"><div><b>${n.title}</b></div><button onclick="db.ref('notices/${n.id}').remove()" class="text-red-500">Del</button></div>`).join(''); }); }
        
        function saveDiary() { const cls = document.getElementById('diaryCls').value; db.ref('diaries/' + cls).push({ sub: document.getElementById('diarySub').value, task: document.getElementById('diaryTask').value, date: document.getElementById('diaryDate').value, timestamp: Date.now() }).then(() => alert("Diary Posted!")); }
        function loadDiaryHistory() { const cls = document.getElementById('diaryCls').value; db.ref('diaries/' + cls).orderByChild('timestamp').on('value', (snap) => { let data = snap.val(); let list = []; for(let id in data) list.unshift({id, ...data[id]}); document.getElementById('diaryHistory').innerHTML = list.map(d => `<div class="p-4 bg-slate-50 border rounded-xl flex justify-between"><div><b>${d.sub}</b> - ${d.date}</div><button onclick="db.ref('diaries/${cls}/${d.id}').remove()" class="text-red-500">Del</button></div>`).join(''); }); }

        function changeAdminPass() { db.ref('settings/adminPass').once('value', snap => { const old = snap.val() || 'Yeasin87*#@'; if(document.getElementById('oldAdminPass').value === old) { db.ref('settings/adminPass').set(document.getElementById('newAdminPass').value); alert("Updated!"); } else alert("Old pass wrong!"); }); }
        
        window.onload = () => { if(sessionStorage.getItem('adminLoggedIn') !== 'true') window.location.href = 'login.html'; loadStudents(); };
    </script>
</body>
</html>
